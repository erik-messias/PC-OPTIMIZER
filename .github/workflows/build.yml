name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release onde anexar o .exe (vazio = só gerar artefato)"
        default: "1.0.0"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar PresentMon (contador de FPS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" --dir pm
          cp pm/PresentMon-*-x64.exe PresentMon.exe
          ls -la PresentMon.exe

      - name: Gerar .exe
        run: >
          pyinstaller --onefile --windowed --uac-admin
          --name NexusPC
          --add-binary "PresentMon.exe;."
          nexus_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC
          path: dist/NexusPC.exe

      - name: Anexar .exe na release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/NexusPC.exe
