name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release onde anexar o .exe (vazio = só gerar artefato)"
        default: "1.0.0"
        required: false

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install psutil pytest
      - run: python -m pytest -q tests

  build:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar PresentMon (contador de FPS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" --dir pm
          cp pm/PresentMon-*-x64.exe PresentMon.exe
          ls -la PresentMon.exe

      - name: Baixar LibreHardwareMonitor (sensores de temperatura)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force lhm_zip | Out-Null
          gh release download --repo LibreHardwareMonitor/LibreHardwareMonitor --pattern "*.zip" --dir lhm_zip
          $zip = Get-ChildItem lhm_zip -Filter *.zip | Where-Object { $_.Name -notmatch 'NET' } | Select-Object -First 1
          if (-not $zip) { $zip = Get-ChildItem lhm_zip -Filter *.zip | Select-Object -First 1 }
          Write-Host "Usando $($zip.Name)"
          Expand-Archive $zip.FullName -DestinationPath lhm_tmp -Force
          $exe = Get-ChildItem lhm_tmp -Recurse -Filter LibreHardwareMonitor.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force lhm | Out-Null
          Copy-Item "$($exe.DirectoryName)\*" lhm -Recurse -Force
          Get-ChildItem lhm | Select-Object -First 30 Name

      - name: Gerar .exe
        shell: pwsh
        run: |
          $a = @('--onefile','--windowed','--uac-admin','--name','NexusPC','--add-binary','PresentMon.exe;.')
          if (Test-Path 'lhm\LibreHardwareMonitor.exe') { $a += @('--add-data','lhm;lhm'); Write-Host 'Embutindo LibreHardwareMonitor' }
          else { Write-Host 'LibreHardwareMonitor NAO embutido' }
          $a += 'nexus_pc.py'
          pyinstaller @a

      - name: Gerar instalador (Inno Setup)
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: NexusPC
          path: |
            dist/NexusPC.exe
            dist/NexusPC-Setup.exe

      - name: Anexar .exe na release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/NexusPC.exe
            dist/NexusPC-Setup.exe
