name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Baixar PresentMon (contador de FPS)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo GameTechDev/PresentMon --pattern "PresentMon-*-x64.exe" --dir pm
          cp pm/PresentMon-*-x64.exe PresentMon.exe
          ls -la PresentMon.exe

      - name: Gerar .exe
        run: >
          pyinstaller --onefile --windowed --uac-admin
          --name OtimizadorPC
          --add-binary "PresentMon.exe;."
          otimizador_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: OtimizadorPC
          path: dist/OtimizadorPC.exe

      - name: Publicar release (só em tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OtimizadorPC.exe
